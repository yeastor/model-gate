syntax = "proto3";

package modelgate;

option go_package = "github.com/yeastor/modelgate/pkg/modelgate;modelgate";

import "google/api/annotations.proto";
import "validate/validate.proto";

message ChatResponse {
  ChatAnswer answer = 1;
}

message ChatAnswer {
  string content = 1;
  repeated Next next = 2;
  Category category = 3;
}

message Next {
  string question_text = 1;
  repeated View view = 2;
}

message View {
  string type = 1;
  string id = 2; // что отправим на бэк
  string value = 3; // что покажем в бейдже
  string question = 5; // что выведем в чате при ответе (нажатии на бейдж)
  string category_id = 6;
  string variant_id = 7;
}

message Chat {
  string id = 1;
}

message ChatQuestion {
  string q = 1;
  ChatQuestionVariant variant = 2;
  Category category = 3;
}

message ChatQuestionVariant {
  string id = 1;
}

message Category {
  string id = 1;
}

message ChatBody {
  Chat chat = 1 [(validate.rules).message.required = true];
  ChatQuestion question = 2 [(validate.rules).message.required = true];
}

message ChatRequest {
  ChatBody chatBody = 1;
}
message CreateResponse {
  ChatAnswer note = 1;
}

message MessageListRequest {
  Chat chat = 1 [(validate.rules).message.required = true];
}

message MessageListResponse {
  repeated Message message = 1;
}

message Message {
  string text  = 1;
  string id = 2;
  int64 direction = 3;
  Category category = 4;
}

// StartStart
message StartRequest {

}

message StartResponse {
  Chat chat = 1;
}

service ModelService {

  rpc Chat(ChatRequest) returns (ChatResponse) {
    option (google.api.http) = {
      post: "/model/chat/chat"
      body: "chatBody"
    };
  }

  rpc MessageList(MessageListRequest) returns (MessageListResponse) {
    option (google.api.http) = {
      post: "/model/chat/massage/list"
      body: "chat"
    };
  }

  rpc StartStart(StartRequest) returns (StartResponse) {
    option (google.api.http) = {
      post: "/model/chat/start/start"
    };
  }
}
